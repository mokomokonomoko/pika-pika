<!DOCTYPE html>
<html lang="ja-jp">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>pika-pika</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* カメラ映像を表示する枠。位置・大きさはJS(applyRect)で動的に設定する */
    #qr-frame {
      position: fixed;
      overflow: hidden;
      box-sizing: border-box;
      border: 3px solid #ffffff;
      border-radius: 16px;
      background: #000;
      z-index: 0;
    }

    /* 枠の中にcoverで表示する(縦横比を保ったまま枠に合わせて切り取る) */
    #qr-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    /* フレーム解析用の作業用キャンバス。画面には出さない */
    #qr-canvas {
      display: none;
    }

    /* Unityの画面は下部のバナーとして重ねる(カメラ映像は隠さない) */
    #unity-container {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 25vh;
      z-index: 1;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: block;
    }

    #unity-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 2;
      color: #fff;
      background: rgba(200, 0, 0, 0.8);
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="qr-frame">
    <video id="qr-video" playsinline muted autoplay></video>
  </div>
  <canvas id="qr-canvas"></canvas>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="unity-warning"></div>

  <script src="jsQR.js"></script>
  <script src="Build/cabd64b7e9574453227d92dc3d6e2bcc.loader.js"></script>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/cabd64b7e9574453227d92dc3d6e2bcc.loader.js";
    var config = {
      dataUrl: buildUrl + "/6b994a47f611feea67ce34df63ee9758.data",
      frameworkUrl: buildUrl + "/84b132999813c6e05114dff62ee93970.framework.js",
      codeUrl: buildUrl + "/1617a5e7de5d14a35f87edfc933cc05c.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "pika-pika",
      productVersion: "0.1.0",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // 進捗バーは今回省略
      }).then((unityInstance) => {
        // .jslib から SendMessage するために、インスタンスをグローバルに保持しておく
        window.unityInstance = unityInstance;
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>

  <script>
    // --- QRコード読み取り(カメラ起動・スキャンループ) ---
    // StartQRScanner() / SetQRCameraRect() は Assets/Plugins/WebGL/QRScanner.jslib から呼ばれる
    window.__qrScanner = {
      video: document.getElementById("qr-video"),
      canvas: document.getElementById("qr-canvas"),
      ctx: document.getElementById("qr-canvas").getContext("2d", { willReadFrequently: true }),
      frameEl: document.getElementById("qr-frame"),
      started: false,
      // x, y: 画面の幅・高さに対する左上の割合(位置)
      // width, height: どちらも画面の「幅」に対する割合(サイズ)。
      // 同じ値にすると、画面の向きが変わっても常に正方形になる。
      rect: { x: 0.3, y: 0.5, width: 0.4, height: 0.4 },
      framePx: null,
      cropPx: null,
      lastText: null,
      lastSentAt: 0,
      debounceMs: 3000,

      init: function () {
        this.applyRect();
        window.addEventListener("resize", () => this.applyRect());
        window.addEventListener("orientationchange", () => this.applyRect());
      },

      // Unity(C#)側からの SetCameraRect(x, y, width, height) を受け取る
      setRect: function (x, y, width, height) {
        this.rect = { x: x, y: y, width: width, height: height };
        this.applyRect();
      },

      // rect(割合)から、枠の実際のpx位置・大きさを計算してCSSに反映する
      applyRect: function () {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var widthPx = this.rect.width * vw;
        var heightPx = this.rect.height * vw; // 幅基準にして正方形を保つ
        this.frameEl.style.left = (this.rect.x * vw) + "px";
        this.frameEl.style.top = (this.rect.y * vh) + "px";
        this.frameEl.style.width = widthPx + "px";
        this.frameEl.style.height = heightPx + "px";
        this.framePx = { width: widthPx, height: heightPx };
      },

      start: function () {
        if (this.started) return;
        this.started = true;

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          unityShowBanner("このブラウザはカメラ(getUserMedia)に対応していません。", "error");
          return;
        }

        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        }).then((stream) => {
          this.video.srcObject = stream;
          return this.video.play();
        }).then(() => {
          requestAnimationFrame(() => this.tick());
        }).catch((err) => {
          unityShowBanner("カメラを起動できませんでした: " + err.message, "error");
        });
      },

      // 枠(object-fit: cover)で実際に見えている範囲と同じ切り出し矩形を、
      // 映像本来の解像度(videoWidth/videoHeight)の座標系で計算する
      updateCropForFrame: function () {
        var w = this.video.videoWidth;
        var h = this.video.videoHeight;
        if (!w || !h || !this.framePx || this.framePx.width <= 0 || this.framePx.height <= 0) {
          this.cropPx = null;
          return;
        }
        var boxAspect = this.framePx.width / this.framePx.height;
        var videoAspect = w / h;
        var cropW, cropH, cropX, cropY;
        if (videoAspect > boxAspect) {
          cropH = h;
          cropW = h * boxAspect;
          cropX = (w - cropW) / 2;
          cropY = 0;
        } else {
          cropW = w;
          cropH = w / boxAspect;
          cropX = 0;
          cropY = (h - cropH) / 2;
        }
        this.cropPx = { x: cropX, y: cropY, width: cropW, height: cropH };
      },

      tick: function () {
        if (this.video.readyState === this.video.HAVE_ENOUGH_DATA) {
          this.updateCropForFrame();
          var crop = this.cropPx;
          if (crop && crop.width > 0 && crop.height > 0) {
            this.canvas.width = crop.width;
            this.canvas.height = crop.height;
            this.ctx.drawImage(
              this.video,
              crop.x, crop.y, crop.width, crop.height,
              0, 0, crop.width, crop.height
            );
            var imageData = this.ctx.getImageData(0, 0, crop.width, crop.height);
            var result = jsQR(imageData.data, crop.width, crop.height);
            if (result && result.data) {
              this.onDetected(result.data);
            }
          }
        }
        requestAnimationFrame(() => this.tick());
      },

      onDetected: function (text) {
        var now = performance.now();
        var isSameAsLast = (text === this.lastText);
        if (isSameAsLast && (now - this.lastSentAt) < this.debounceMs) {
          return;
        }
        this.lastText = text;
        this.lastSentAt = now;
        if (window.unityInstance) {
          window.unityInstance.SendMessage("QRManager", "OnQRCodeScanned", text);
        }
      }
    };
    window.__qrScanner.init();
  </script>
</body>
</html>
