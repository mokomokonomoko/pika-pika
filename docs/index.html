<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>pika-pika</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* カメラ映像を表示する枠。位置・大きさはJS(applyRect)で動的に設定する */
    #qr-frame {
      position: fixed;
      overflow: hidden;
      box-sizing: border-box;
      border: 3px solid #ffffff;
      border-radius: 16px;
      background: #000;
      z-index: 3;
      pointer-events: none;
    }

    /* 枠の中にcoverで表示する(縦横比を保ったまま枠に合わせて切り取る) */
    #qr-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #qr-portrait {
      position: absolute;
      inset: 5% 0;
      width: 100%;
      height: 90%;
      object-fit: contain;
    }

    /* The scan buffer is never displayed. */
    #qr-canvas {
      display: none;
    }

    /* The game uses the entire viewport. The original scanner demo uses a banner. */
    #unity-container {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

.scanner-demo #unity-container { height: 25vh; }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: block;
    }

    #unity-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 2;
      color: #fff;
      background: rgba(200, 0, 0, 0.8);
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="qr-frame" hidden>
    <video id="qr-video" playsinline muted autoplay></video>
    <img id="qr-portrait" alt="" hidden>
  </div>
  <canvas id="qr-canvas"></canvas>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="unity-warning"></div>

  <script src="jsQR.js"></script>
  <script src="qr-camera.js"></script>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/2077f6808bc996565ad340df7a51fde1.loader.js";
    var config = {
      dataUrl: buildUrl + "/4789c487532c8aa0555f5302474ab91a.data",
      frameworkUrl: buildUrl + "/a9b374f8a9608b090bcf19382b8b7633.framework.js",
      codeUrl: buildUrl + "/6ef124ddbe61ed40b0c7e9aa3d1c0eb1.wasm",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "pika-pika",
      productVersion: "0.1.0",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.textContent = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // 進捗バーは今回省略
      }).then((unityInstance) => {
        // .jslib から SendMessage するために、インスタンスをグローバルに保持しておく
        window.unityInstance = unityInstance;
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>

</body>
</html>
